<svg width="100%" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1c2126"/>
      <stop offset="55%" stop-color="#0c0e10"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="metalStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#0057ff;#ff1a3c;#00e5ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#3a4048"/>
      <stop offset="100%" stop-color="#ff1a3c">
        <animate attributeName="stop-color" values="#ff1a3c;#00e5ff;#0057ff;#ff1a3c" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="grayMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#454d54"/>
      <stop offset="45%" stop-color="#22262a"/>
      <stop offset="100%" stop-color="#0d0e10"/>
    </linearGradient>

    <linearGradient id="helmetMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c1018"/>
      <stop offset="50%" stop-color="#2a0b0f"/>
      <stop offset="100%" stop-color="#100405"/>
    </linearGradient>

    <radialGradient id="reactorCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="30%" stop-color="#7df9ff"/>
      <stop offset="65%" stop-color="#00b7d6"/>
      <stop offset="100%" stop-color="#001a1f" stop-opacity="0"/>
    </radialGradient>

    <pattern id="hexPattern" width="46" height="80" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M23 0 L46 13 L46 40 L23 53 L0 40 L0 13 Z" fill="none" stroke="#0fb8d6" stroke-width="0.6" opacity="0.5"/>
      <path d="M23 40 L46 53 L46 80 L23 93 L0 80 L0 53 Z" fill="none" stroke="#0fb8d6" stroke-width="0.6" opacity="0.5"/>
    </pattern>

    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frameClip">
      <rect x="6" y="6" width="988" height="548" rx="18"/>
    </clipPath>
  </defs>

  <!-- BACKGROUND -->
  <rect x="0" y="0" width="1000" height="560" fill="url(#bgGrad)"/>

  <g clip-path="url(#frameClip)">
    <rect x="0" y="0" width="1000" height="560" fill="url(#hexPattern)" opacity="0.16"/>

    <!-- PARTICLE FIELD -->
    <g fill="#5be8ff">
      <circle cx="80" cy="90" r="1.6" opacity="0.7"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="160" cy="220" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="400" r="1.8" opacity="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="480" r="1.3" opacity="0.4"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="110" r="1.5" opacity="0.6"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="260" r="1.7" opacity="0.5"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="410" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="470" r="1.4" opacity="0.6"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="60" r="1.1" opacity="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="70" r="1.3" opacity="0.4"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.7s" repeatCount="indefinite"/></circle>
    </g>

    <!-- TITLE -->
    <text x="500" y="70" text-anchor="middle" font-family="'Courier New', monospace" font-size="30" letter-spacing="8" fill="#8ff3ff" filter="url(#glowCyan)" font-weight="bold">STARK INDUSTRIES</text>
    <text x="500" y="98" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" letter-spacing="10" fill="#3fb8d6">AI DIVISION</text>

    <!-- ENERGY WAVEFORM -->
    <path d="M120,124 L220,124 L240,108 L260,140 L280,100 L300,148 L320,116 L340,132 L360,124 L880,124"
          fill="none" stroke="#4be9ff" stroke-width="1.6" opacity="0.8" filter="url(#glowCyan)"
          stroke-dasharray="6 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.6s" repeatCount="indefinite"/>
    </path>

    <!-- CONCENTRIC HUD RINGS (behind figure) -->
    <g transform="translate(500,330)">
      <circle r="210" fill="none" stroke="#0fb8d6" stroke-width="1" opacity="0.35" stroke-dasharray="2 6"/>
      <circle r="175" fill="none" stroke="#1c8fd6" stroke-width="1" opacity="0.4" stroke-dasharray="14 6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="150" fill="none" stroke="#4be9ff" stroke-width="1.4" opacity="0.55" stroke-dasharray="1 10">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle r="128" fill="none" stroke="#ff1a3c" stroke-width="1" opacity="0.3" stroke-dasharray="30 8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
      </circle>

      <!-- targeting corner brackets -->
      <g stroke="#4be9ff" stroke-width="2" fill="none" opacity="0.7">
        <path d="M-230,-230 L-210,-230 L-210,-210"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.4s" repeatCount="indefinite"/></path>
        <path d="M230,-230 L210,-230 L210,-210"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.4s" repeatCount="indefinite"/></path>
        <path d="M-230,230 L-210,230 L-210,210"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.4s" repeatCount="indefinite"/></path>
        <path d="M230,230 L210,230 L210,210"><animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.4s" repeatCount="indefinite"/></path>
      </g>
    </g>

    <!-- SUIT BUST -->
    <g transform="translate(500,345)">
      <!-- shoulders / chest plate -->
      <path d="M-150,190 C-150,70 -95,10 0,10 C95,10 150,70 150,190 L150,220 L-150,220 Z"
            fill="url(#grayMetal)" stroke="#5be8ff" stroke-width="1" opacity="0.96"/>
      <!-- chest seam lines -->
      <path d="M-60,60 L-60,190 M60,60 L60,190 M0,20 L0,190" stroke="#ff2b3f" stroke-width="1" opacity="0.35"/>
      <path d="M-150,190 C-150,70 -95,10 0,10 C95,10 150,70 150,190" fill="none" stroke="#7fe9ff" stroke-width="1.2" opacity="0.5"/>

      <!-- helmet -->
      <path d="M-72,-40 C-72,-115 -38,-150 0,-150 C38,-150 72,-115 72,-40 C72,-5 55,15 0,18 C-55,15 -72,-5 -72,-40 Z"
            fill="url(#helmetMetal)" stroke="#ff3b4e" stroke-width="1.2"/>
      <path d="M-72,-40 C-72,-115 -38,-150 0,-150 C38,-150 72,-115 72,-40" fill="none" stroke="#ffb199" stroke-width="0.8" opacity="0.4"/>

      <!-- faceplate seams -->
      <path d="M0,-150 L0,18 M-40,-130 L-30,10 M40,-130 L30,10" stroke="#100405" stroke-width="1.4" opacity="0.6"/>

      <!-- eyes -->
      <g filter="url(#glowCyan)">
        <rect x="-38" y="-78" width="24" height="8" rx="4" fill="#eafcff">
          <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="14" y="-78" width="24" height="8" rx="4" fill="#eafcff">
          <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- arc reactor -->
      <g transform="translate(0,110)">
        <circle r="34" fill="none" stroke="#0fb8d6" stroke-width="1.5" opacity="0.6">
          <animate attributeName="r" values="32;37;32" dur="2.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle r="24" fill="none" stroke="#4be9ff" stroke-width="2.4" stroke-dasharray="5 4">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
        </circle>
        <circle r="15" fill="url(#reactorCore)" filter="url(#glowCyan)">
          <animate attributeName="r" values="13;16;13" dur="1.7s" repeatCount="indefinite"/>
        </circle>
        <circle r="5.5" fill="#ffffff">
          <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite"/>
        </circle>
        <!-- orbiting energy particles -->
        <circle cx="0" cy="-46" r="2" fill="#8ff3ff">
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="46" r="1.6" fill="#8ff3ff">
          <animateTransform attributeName="transform" type="rotate" from="180 0 0" to="540 0 0" dur="4s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- idle hover -->
      <animateTransform attributeName="transform" type="translate" values="500,345; 500,341; 500,345" dur="4s" repeatCount="indefinite" additive="sum"/>
    </g>

    <!-- SCANNING LASER -->
    <rect x="0" y="0" width="1000" height="4" fill="#4be9ff" opacity="0.55" filter="url(#glowSoft)">
      <animate attributeName="y" values="0;556;0" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- METALLIC ANIMATED BORDER -->
  <rect x="6" y="6" width="988" height="548" rx="18" fill="none" stroke="url(#metalStroke)" stroke-width="2.5"/>
</svg>
