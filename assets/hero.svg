<svg width="100%" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#2a0a0d"/>
      <stop offset="55%" stop-color="#120507"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="metalStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b4e">
        <animate attributeName="stop-color" values="#ff3b4e;#ffb199;#ff8a00;#ff3b4e" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#3a2020"/>
      <stop offset="100%" stop-color="#ff8a00">
        <animate attributeName="stop-color" values="#ff8a00;#ff3b4e;#ffb199;#ff8a00" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="redMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c81f2e"/>
      <stop offset="55%" stop-color="#6e0f18"/>
      <stop offset="100%" stop-color="#1c0405"/>
    </linearGradient>

    <radialGradient id="reactorCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="35%" stop-color="#ffd8a8"/>
      <stop offset="70%" stop-color="#ff8a00"/>
      <stop offset="100%" stop-color="#1c0405" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="repulsorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffd8a8"/>
      <stop offset="100%" stop-color="#ff8a00" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff2cf"/>
      <stop offset="35%" stop-color="#ff8a00"/>
      <stop offset="100%" stop-color="#ff1a1a" stop-opacity="0"/>
    </radialGradient>

    <pattern id="hexPattern" width="46" height="80" patternUnits="userSpaceOnUse">
      <path d="M23 0 L46 13 L46 40 L23 53 L0 40 L0 13 Z" fill="none" stroke="#8a1420" stroke-width="0.6" opacity="0.5"/>
      <path d="M23 40 L46 53 L46 80 L23 93 L0 80 L0 53 Z" fill="none" stroke="#8a1420" stroke-width="0.6" opacity="0.5"/>
    </pattern>

    <filter id="glowRed" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowWhite" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frameClip">
      <rect x="6" y="6" width="988" height="548" rx="18"/>
    </clipPath>

    <!-- closed elliptical loop for the flight path -->
    <path id="flightPath" d="M730,330 A230,150 0 1 1 269.9,330 A230,150 0 1 1 730,330 Z"/>

    <!-- reusable chibi Iron Man, drawn facing +x (nose/head toward direction of travel) -->
    <g id="chibi">
      <!-- boot thrusters (rear) -->
      <circle cx="-34" cy="-6" r="6" fill="url(#flameGlow)" filter="url(#glowRed)">
        <animate attributeName="r" values="4.5;7;4.5" dur="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-34" cy="6" r="6" fill="url(#flameGlow)" filter="url(#glowRed)">
        <animate attributeName="r" values="4.5;7;4.5" dur="0.35s" repeatCount="indefinite"/>
      </circle>
      <!-- trailing legs -->
      <ellipse cx="-20" cy="-6" rx="15" ry="5.5" fill="url(#redMetal)" stroke="#1c0405" stroke-width="0.8"/>
      <ellipse cx="-20" cy="6" rx="15" ry="5.5" fill="url(#redMetal)" stroke="#1c0405" stroke-width="0.8"/>
      <!-- torso -->
      <ellipse cx="2" cy="0" rx="20" ry="13" fill="url(#redMetal)" stroke="#1c0405" stroke-width="1"/>
      <!-- chest reactor -->
      <circle cx="8" cy="0" r="5" fill="url(#reactorCore)" filter="url(#glowWhite)">
        <animate attributeName="r" values="4;5.6;4" dur="1.3s" repeatCount="indefinite"/>
      </circle>
      <!-- arms swept back -->
      <ellipse cx="4" cy="-15" rx="12" ry="5" fill="url(#redMetal)" stroke="#1c0405" stroke-width="0.8" transform="rotate(-12 4 -15)"/>
      <ellipse cx="4" cy="15" rx="12" ry="5" fill="url(#redMetal)" stroke="#1c0405" stroke-width="0.8" transform="rotate(12 4 15)"/>
      <!-- hand repulsors -->
      <circle cx="-6" cy="-19" r="3.4" fill="url(#repulsorGlow)" filter="url(#glowWhite)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-6" cy="19" r="3.4" fill="url(#repulsorGlow)" filter="url(#glowWhite)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" repeatCount="indefinite"/>
      </circle>
      <!-- head / mask, nose pointing +x -->
      <path d="M14,0 C24,-2 30,-8 30,-1 C30,-1 30,1 30,1 C30,8 24,2 14,0 Z" fill="url(#redMetal)" opacity="0"/>
      <ellipse cx="24" cy="0" rx="11" ry="9.5" fill="url(#redMetal)" stroke="#1c0405" stroke-width="1"/>
      <path d="M17,-9 L34,-2 L34,2 L17,9 Z" fill="url(#redMetal)"/>
      <g filter="url(#glowWhite)">
        <rect x="19" y="-4.5" width="10" height="2.6" rx="1.3" fill="#fff6e8"/>
      </g>
    </g>
  </defs>

  <!-- BACKGROUND -->
  <rect x="0" y="0" width="1000" height="560" fill="url(#bgGrad)"/>

  <g clip-path="url(#frameClip)">
    <rect x="0" y="0" width="1000" height="560" fill="url(#hexPattern)" opacity="0.18"/>

    <!-- PARTICLE FIELD -->
    <g fill="#ff8a6a">
      <circle cx="80" cy="90" r="1.6" opacity="0.7"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="160" cy="220" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="400" r="1.8" opacity="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="480" r="1.3" opacity="0.4"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="110" r="1.5" opacity="0.6"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="260" r="1.7" opacity="0.5"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="410" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="470" r="1.4" opacity="0.6"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="60" r="1.1" opacity="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="70" r="1.3" opacity="0.4"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.7s" repeatCount="indefinite"/></circle>
    </g>

    <!-- TITLE -->
    <text x="500" y="66" text-anchor="middle" font-family="'Courier New', monospace" font-size="30" letter-spacing="8" fill="#ff5a4d" filter="url(#glowRed)" font-weight="bold">BIT INDUSTRIES</text>
    <text x="500" y="92" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" letter-spacing="9" fill="#ff9f80">AI DIVISION</text>
    <text x="500" y="114" text-anchor="middle" font-family="'Courier New', monospace" font-style="italic" font-size="12" fill="#c98a78">"Sometimes you gotta build the mind before you build the machine."</text>

    <!-- ENERGY WAVEFORM -->
    <path d="M120,134 L220,134 L240,118 L260,150 L280,110 L300,158 L320,126 L340,142 L360,134 L880,134"
          fill="none" stroke="#ff6a4d" stroke-width="1.6" opacity="0.8" filter="url(#glowRed)"
          stroke-dasharray="6 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.6s" repeatCount="indefinite"/>
    </path>

    <!-- CONCENTRIC HUD RINGS -->
    <g transform="translate(500,330)">
      <circle r="230" fill="none" stroke="#8a1420" stroke-width="1" opacity="0.4" stroke-dasharray="2 6"/>
      <circle r="195" fill="none" stroke="#c81f2e" stroke-width="1" opacity="0.4" stroke-dasharray="14 6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="165" fill="none" stroke="#ff6a4d" stroke-width="1.4" opacity="0.55" stroke-dasharray="1 10">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle r="140" fill="none" stroke="#ff8a00" stroke-width="1" opacity="0.35" stroke-dasharray="30 8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
      </circle>

      <!-- targeting corner brackets -->
      <g stroke="#ff6a4d" stroke-width="2" fill="none" opacity="0.7">
        <path d="M-250,-250 L-230,-250 L-230,-230"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.4s" repeatCount="indefinite"/></path>
        <path d="M250,-250 L230,-250 L230,-230"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.4s" repeatCount="indefinite"/></path>
        <path d="M-250,250 L-230,250 L-230,230"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.4s" repeatCount="indefinite"/></path>
        <path d="M250,250 L230,250 L230,230"><animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.4s" repeatCount="indefinite"/></path>
      </g>

      <!-- BIG BACKGROUND REACTOR EMBLEM -->
      <circle r="60" fill="none" stroke="#ff8a00" stroke-width="1.5" opacity="0.5">
        <animate attributeName="r" values="56;64;56" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.25;0.6;0.25" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="42" fill="none" stroke="#ff6a4d" stroke-width="3" stroke-dasharray="6 5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle r="26" fill="url(#reactorCore)" filter="url(#glowWhite)">
        <animate attributeName="r" values="23;28;23" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="9" fill="#fffdf5">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- FLYING CHIBI IRON MAN + COMET TRAIL -->
    <g opacity="0.55">
      <use href="#chibi" xlink:href="#chibi" transform="scale(0.55)">
        <animateMotion dur="7s" begin="-0.6s" repeatCount="indefinite" rotate="auto">
          <mpath href="#flightPath" xlink:href="#flightPath"/>
        </animateMotion>
      </use>
    </g>
    <g opacity="0.3">
      <use href="#chibi" xlink:href="#chibi" transform="scale(0.4)">
        <animateMotion dur="7s" begin="-1.1s" repeatCount="indefinite" rotate="auto">
          <mpath href="#flightPath" xlink:href="#flightPath"/>
        </animateMotion>
      </use>
    </g>
    <g>
      <use href="#chibi" xlink:href="#chibi">
        <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
          <mpath href="#flightPath" xlink:href="#flightPath"/>
        </animateMotion>
      </use>
    </g>

    <!-- SCANNING LASER -->
    <rect x="0" y="0" width="1000" height="4" fill="#ff6a4d" opacity="0.5" filter="url(#glowSoft)">
      <animate attributeName="y" values="0;556;0" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.65;0" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- METALLIC ANIMATED BORDER -->
  <rect x="6" y="6" width="988" height="548" rx="18" fill="none" stroke="url(#metalStroke)" stroke-width="2.5"/>
</svg>
