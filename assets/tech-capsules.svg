        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="92" y="29" fill="#ffd3d8">STREAMLIT</text>
    </g>
    <g transform="translate(786,72)">
      <rect width="204" height="46" rx="23" fill="url(#capFill)" stroke="#4be9ff" stroke-width="1.4" filter="url(#capGlow)">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="2.7s" repeatCount="indefinite"/>
      </rect>
