<svg width="100%" viewBox="0 0 1000 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="capFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1418" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1418" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="capGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g font-family="'Courier New',monospace" font-size="14" letter-spacing="1" text-anchor="middle">
    <!-- row 1 -->
    <g transform="translate(10,10)">
      <rect width="184" height="46" rx="23" fill="url(#capFill)" stroke="#4be9ff" stroke-width="1.4" filter="url(#capGlow)">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="92" y="29" fill="#c9fbff">PYTHON</text>
    </g>
    <g transform="translate(204,10)">
      <rect width="184" height="46" rx="23" fill="url(#capFill)" stroke="#ff3b4e" stroke-width="1.4" filter="url(#capGlow)">
