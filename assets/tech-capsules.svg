      </rect>
      <text x="92" y="29" fill="#ffd3d8">TENSORFLOW</text>
    </g>
    <g transform="translate(398,10)">
      <rect width="184" height="46" rx="23" fill="url(#capFill)" stroke="#4be9ff" stroke-width="1.4" filter="url(#capGlow)">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <text x="92" y="29" fill="#c9fbff">PYTORCH</text>
    </g>
    <g transform="translate(592,10)">
      <rect width="184" height="46" rx="23" fill="url(#capFill)" stroke="#0057ff" stroke-width="1.4" filter="url(#capGlow)">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
      <text x="92" y="29" fill="#cfe0ff">SQL</text>
    </g>
    <g transform="translate(786,10)">
      <rect width="204" height="46" rx="23" fill="url(#capFill)" stroke="#4be9ff" stroke-width="1.4" filter="url(#capGlow)">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <text x="102" y="29" fill="#c9fbff">LANGCHAIN</text>
    </g>

    <!-- row 2 -->
    <g transform="translate(10,72)">
      <rect width="184" height="46" rx="23" fill="url(#capFill)" stroke="#ff3b4e" stroke-width="1.4" filter="url(#capGlow)">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <text x="92" y="29" fill="#ffd3d8">QDRANT</text>
    </g>
    <g transform="translate(204,72)">
      <rect width="184" height="46" rx="23" fill="url(#capFill)" stroke="#4be9ff" stroke-width="1.4" filter="url(#capGlow)">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1.8s" repeatCount="indefinite"/>
      </rect>
      <text x="92" y="29" fill="#c9fbff">DOCKER</text>
    </g>
    <g transform="translate(398,72)">
